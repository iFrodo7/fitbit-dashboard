<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exportar Splash AIRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --dur-slow: 360ms;
    --ease-out: cubic-bezier(0.16,1,0.3,1);
    --ease-std: cubic-bezier(0.4,0,0.2,1);
    --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    font-family: 'Rajdhani', sans-serif;
    color: #fff;
  }

  /* ── SPLASH ── */
  #sp {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    width: 100vw;
    height: 100vh;
    background: #000;
  }

  #sp-svg { width: 188px; height: 188px; overflow: visible; }

  #sp-a {
    opacity: 0;
    filter: drop-shadow(0 0 6px #00f5ff) drop-shadow(0 0 16px rgba(0,245,255,.35));
  }
  @keyframes sp-a-draw {
    0%   { stroke-dashoffset: 366; opacity: 0; }
    8%   { opacity: 1; }
    100% { stroke-dashoffset: 0;   opacity: 1; }
  }
  #sp.sp-on #sp-a { animation: sp-a-draw .65s .28s var(--ease-out) forwards; }

  #sp-r {
    opacity: 0;
    filter: drop-shadow(0 0 9px #00f5ff) drop-shadow(0 0 20px rgba(0,245,255,.4));
  }
  @keyframes sp-ring {
    0%   { stroke-dasharray: 0 1131;   opacity: .35; }
    16%  { opacity: 1; }
    100% { stroke-dasharray: 850 1131; opacity: 1; }
  }
  #sp.sp-on #sp-r { animation: sp-ring .78s .82s var(--ease-out) forwards; }

  #sp-p { opacity: 0; transform-box: fill-box; transform-origin: center; }
  @keyframes sp-pulse {
    0%   { opacity: .5; transform: scale(1); }
    100% { opacity: 0;  transform: scale(1.38); }
  }
  #sp.sp-on #sp-p { animation: sp-pulse .65s 1.68s ease-out forwards; }

  #sp-brd { opacity: 0; transform: translateY(10px); text-align: center; }
  #sp-nm  {
    font-family: 'Rajdhani', sans-serif;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 14px;
    color: #fff;
    line-height: 1;
    padding-left: 14px;
  }
  #sp-st  {
    font-family: 'Rajdhani', sans-serif;
    font-size: 9px;
    letter-spacing: 5px;
    color: rgba(0,245,255,.5);
    margin-top: 5px;
    padding-left: 5px;
    text-transform: uppercase;
  }
  @keyframes sp-brd {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #sp.sp-on #sp-brd { animation: sp-brd .48s 1.55s var(--ease-out) forwards; }

  @keyframes sp-out {
    from { opacity: 1; transform: scale(1); }
    to   { opacity: 0; transform: scale(1.045); }
  }
  #sp.sp-off { animation: sp-out .42s var(--ease-std) forwards; }

  /* ── UI de control ── */
  #ctrl {
    position: fixed;
    bottom: 32px;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 10;
  }

  #btn {
    background: transparent;
    border: 1.5px solid rgba(0,245,255,.6);
    color: rgba(0,245,255,.9);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 12px 28px;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.2s, color 0.2s;
  }
  #btn:hover { background: rgba(0,245,255,.1); }
  #btn:disabled { opacity: 0.3; cursor: default; }

  #status {
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(0,245,255,.45);
    text-transform: uppercase;
    min-height: 16px;
  }

  #hint {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255,255,255,.25);
    text-transform: uppercase;
    text-align: center;
    max-width: 340px;
    line-height: 1.7;
  }
</style>
</head>
<body>

<!-- ── Splash ── -->
<div id="sp">
  <svg id="sp-svg" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sp-g" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#00f5ff"/>
        <stop offset="100%" stop-color="#00ff88"/>
      </linearGradient>
    </defs>
    <!-- Ghost traces — barely lit -->
    <circle cx="256" cy="256" r="180" fill="none"
            stroke="rgba(255,255,255,0.055)" stroke-width="20"/>
    <path d="M188 346 L256 176 L324 346" fill="none"
          stroke="rgba(255,255,255,0.055)" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- A draw -->
    <path id="sp-a" d="M188 346 L256 176 L324 346"
          fill="none" stroke="url(#sp-g)" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="366 400" stroke-dashoffset="366"/>
    <!-- Ring sweep -->
    <circle id="sp-r" cx="256" cy="256" r="180"
            fill="none" stroke="url(#sp-g)" stroke-width="20"
            stroke-linecap="round"
            stroke-dasharray="0 1131"
            transform="rotate(-90 256 256)"/>
    <!-- Pulse ripple -->
    <circle id="sp-p" cx="256" cy="256" r="180"
            fill="none" stroke="rgba(0,245,255,0.5)" stroke-width="3"/>
  </svg>
  <div id="sp-brd">
    <div id="sp-nm">AIRA</div>
    <div id="sp-st">BIOMETRIC CORE</div>
  </div>
</div>

<!-- ── Controles ── -->
<div id="ctrl">
  <div id="hint">
    Abre esta página en Chrome · Haz clic en el botón<br>
    Comparte esta pestaña en el diálogo · El video se descarga solo
  </div>
  <button id="btn" onclick="startCapture()">⬤  Grabar animación</button>
  <div id="status"></div>
</div>

<script>
  const RECORD_MS = 3200; // total ms a grabar (animación dura ~2.6 s)

  function setStatus(txt) {
    document.getElementById('status').textContent = txt;
  }

  function playSplash() {
    const el = document.getElementById('sp');
    el.classList.remove('sp-on', 'sp-off');
    void el.offsetWidth; // force reflow
    el.classList.add('sp-on');
    setTimeout(() => {
      el.classList.add('sp-off');
      setTimeout(() => {
        el.classList.remove('sp-on', 'sp-off');
      }, 450);
    }, 2150);
  }

  async function startCapture() {
    const btn = document.getElementById('btn');
    btn.disabled = true;

    // Supported MIME types en orden de preferencia
    const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4']
      .find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';

    let stream;
    try {
      setStatus('Selecciona esta pestaña en el diálogo...');
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: 60, width: window.screen.width, height: window.screen.height },
        audio: false,
        // Chrome 94+ pre-selecciona la pestaña actual
        preferCurrentTab: true,
        selfBrowserSurface: 'include',
      });
    } catch (e) {
      setStatus('Cancelado — vuelve a intentarlo');
      btn.disabled = false;
      return;
    }

    const chunks = [];
    const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8_000_000 });

    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };

    recorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const ext  = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
      const blob = new Blob(chunks, { type: mime });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = `aira-splash.${ext}`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 10_000);
      setStatus(`✓ Descargado como aira-splash.${ext}`);
      btn.disabled = false;
      btn.textContent = '⬤  Grabar de nuevo';
    };

    // Breve pausa para que el diálogo cierre y la pestaña vuelva al frente
    await new Promise(r => setTimeout(r, 400));

    recorder.start(100); // chunks cada 100 ms
    setStatus('Grabando...');
    playSplash();

    setTimeout(() => {
      recorder.stop();
      setStatus('Procesando...');
    }, RECORD_MS);
  }
</script>
</body>
</html>
