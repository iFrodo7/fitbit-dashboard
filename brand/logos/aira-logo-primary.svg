<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#020810"/>
    <stop offset="100%" stop-color="#0a1828"/>
  </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#00f5ff"/>
    <stop offset="100%" stop-color="#7b2fff"/>
  </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  </defs>
  <rect width="600" height="360" fill="url(#bg)"/>
  <g transform="translate(300,148) scale(0.3125) translate(-256,-256)">
    <circle cx="256" cy="256" r="180" fill="none" stroke="#00f5ff1a" stroke-width="20"/>
    <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ring)" stroke-width="20"
            stroke-linecap="round" stroke-dasharray="850 1131"
            transform="rotate(-90 256 256)" filter="url(#glow)" opacity="0.95"/>
    <g filter="url(#glow)" fill="none" stroke="url(#ring)" stroke-width="34"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M188 346 L256 176 L324 346"/>
      <path d="M214 282 H298"/>
    </g>
  </g>
  <text x="300" y="270" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="56" letter-spacing="14" fill="#00f5ff">AIRA</text>
  <text x="300" y="302" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300" font-size="13" letter-spacing="5" fill="#00f5ff99">BIOMETRIC DASHBOARD</text>
</svg>